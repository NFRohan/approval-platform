<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>Offline · Admin Services Portal</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAFAFA;
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #18181B;
         padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 340px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 18px 0 8px; }
  p { font-size: 14px; line-height: 1.55; color: #52525B; margin: 0 0 20px; }
  button { font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: #4F46E5; border: 0; border-radius: 10px;
           padding: 12px 22px; min-width: 160px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Your requests and approvals are kept on the server, so nothing is lost. Reconnect and carry on where you were.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
